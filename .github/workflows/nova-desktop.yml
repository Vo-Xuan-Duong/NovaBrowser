name: NovaBrowser desktop check

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "crates/nova-desktop/**"
      - ".github/workflows/nova-desktop.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check NovaBrowser desktop crate
        run: cargo check -p nova-desktop
