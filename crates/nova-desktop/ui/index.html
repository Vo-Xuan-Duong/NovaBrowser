<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title>NovaBrowser</title>
    <link rel="stylesheet" href="app.css" />
    <script src="icons.js" defer></script>
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="browser-window">
      <header class="tab-strip" id="titlebar">
        <div class="tab-list" id="tab-list" role="tablist" aria-label="Open tabs"></div>
        <button class="new-tab-button" id="new-tab" aria-label="New tab" title="New tab">
          <span class="icon-slot" data-icon="plus" aria-hidden="true"></span>
        </button>
        <div class="drag-space" aria-hidden="true"></div>
        <div class="window-controls" aria-label="Window controls">
          <button class="window-control" id="minimize" aria-label="Minimize" title="Minimize">
          <span class="icon-slot" data-icon="minus" aria-hidden="true"></span>
        </button>
          <button class="window-control" id="maximize" aria-label="Maximize" title="Maximize">
          <span class="icon-slot" data-icon="square" aria-hidden="true"></span>
        </button>
          <button class="window-control close-control" id="close" aria-label="Close" title="Close">
          <span class="icon-slot" data-icon="x" aria-hidden="true"></span>
        </button>
        </div>
      </header>

      <nav class="toolbar" aria-label="Browser controls">
        <div class="navigation-actions">
          <button class="toolbar-button" id="back" aria-label="Back" title="Back" disabled>
          <span class="icon-slot" data-icon="arrow-left" aria-hidden="true"></span>
        </button>
          <button class="toolbar-button" id="forward" aria-label="Forward" title="Forward" disabled>
          <span class="icon-slot" data-icon="arrow-right" aria-hidden="true"></span>
        </button>
          <button class="toolbar-button" id="reload" aria-label="Reload" title="Reload">
          <span class="icon-slot" data-icon="rotate-cw" aria-hidden="true"></span>
        </button>
        </div>

        <form class="omnibox" id="address-form" autocomplete="off">
          <span class="site-controls" aria-hidden="true" data-icon="sliders-horizontal"></span>
          <input id="address" type="text" spellcheck="false" aria-label="Search or type a URL" placeholder="Search or type a URL" value="https://example.com/" />
          <button class="bookmark-button" id="bookmark-current" type="button" aria-label="Bookmark this page" title="Bookmark this page">
          <span class="icon-slot" data-icon="bookmark" aria-hidden="true"></span>
        </button>
        </form>
        <button class="toolbar-button library-button" id="show-bookmarks" aria-label="Show bookmarks" title="Bookmarks">
          <span class="icon-slot" data-icon="folder-open" aria-hidden="true"></span>
        </button>
        <button class="toolbar-button library-button" id="show-history" aria-label="Show browsing history" title="History">
          <span class="icon-slot" data-icon="clock" aria-hidden="true"></span>
        </button>
        <button class="toolbar-button library-button" id="show-settings" aria-label="Settings" title="Settings">
          <span class="icon-slot" data-icon="settings-2" aria-hidden="true"></span>
        </button>
      </nav>

      <div class="loading-track"><div class="loading-indicator" id="loading-indicator"></div></div>

      <section class="page-area" id="page-area" tabindex="0" aria-label="Web page">
        <img id="page-frame" alt="Rendered web page" draggable="false" />
        <div class="status-bubble" id="status-bubble" role="status" aria-live="polite">
          <span class="status-dot"></span>
          <span class="status-message" id="status-message">Starting browser engine</span>
        </div>
      </section>

      <aside class="library-panel" id="library-panel" aria-label="Browser library" hidden>
        <div class="library-heading">
          <div>
            <span class="library-eyebrow">YOUR LIBRARY</span>
            <div class="panel-heading-title"><span class="panel-heading-icon" id="library-title-icon" data-icon="folder-open" aria-hidden="true"></span><h2 id="library-title">Bookmarks</h2></div>
          </div>
          <button class="panel-close" id="close-library" aria-label="Close library"><span class="icon-slot" data-icon="x" aria-hidden="true"></span></button>
        </div>
        <div class="library-tabs" role="tablist">
          <button class="library-tab" id="history-tab" role="tab">History</button>
          <button class="library-tab" id="bookmarks-tab" role="tab">Bookmarks</button>
        </div>
        <div class="library-list" id="library-list"></div>
        <div class="library-footer" id="history-footer">
          <button class="text-button" id="clear-history"><span class="icon-slot" data-icon="trash" aria-hidden="true"></span>Clear browsing history</button>
        </div>
      </aside>

      <aside class="settings-panel" id="settings-panel" role="dialog" aria-modal="false" aria-labelledby="settings-title" hidden>
        <div class="library-heading">
          <div>
            <span class="library-eyebrow">PREFERENCES</span>
            <div class="panel-heading-title"><span class="panel-heading-icon" data-icon="settings-2" aria-hidden="true"></span><h2 id="settings-title">Settings</h2></div>
          </div>
          <button class="panel-close" id="close-settings" aria-label="Close settings"><span class="icon-slot" data-icon="x" aria-hidden="true"></span></button>
        </div>
        <form class="settings-form" id="settings-form">
          <label class="settings-field" for="theme-setting">
            <span class="settings-field-title"><span class="settings-field-icon" data-icon="palette" aria-hidden="true"></span>Appearance</span>
            <select id="theme-setting">
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </label>
          <p class="settings-help">Choose the color theme for NovaBrowser.</p>
          <label class="settings-field" for="homepage-setting">
            <span class="settings-field-title"><span class="settings-field-icon" data-icon="house" aria-hidden="true"></span>Homepage for new tabs</span>
            <input id="homepage-setting" type="text" autocomplete="url" spellcheck="false" maxlength="4096" aria-describedby="homepage-help settings-error" placeholder="https://example.com/" />
          </label>
          <p class="settings-help" id="homepage-help">Enter a website or search query. NovaBrowser restores your previous tabs when reopening; this homepage is used for new tabs and a fresh session.</p>
          <div class="settings-error" id="settings-error" role="alert" hidden></div>
          <div class="settings-actions">
            <button class="settings-cancel" id="cancel-settings" type="button">Cancel</button>
            <button class="settings-save" type="submit"><span class="icon-slot" data-icon="check" aria-hidden="true"></span>Save settings</button>
          </div>
        </form>
      </aside>
    </main>
  </body>
</html>
