[package]
name = "nova-desktop"
description = "Experimental native browser shell powered by the Obscura engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
obscura-browser = { workspace = true, features = ["render"] }
obscura-render = { workspace = true, features = ["paint"] }
tokio = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
