[package]
name = "nova-desktop"
description = "Experimental native browser shell powered by the Obscura engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Native Servo is opt-in until a Windows build and compositor test pass.
# The existing browser and UI remain the default build.
# Servo and V8 use incompatible ICU versions: build Servo in its own workspace.
[features]
default = []
servo-embed = []

[dependencies]
obscura-browser = { workspace = true, features = ["render"] }
obscura-render = { workspace = true, features = ["paint"] }
tokio = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
