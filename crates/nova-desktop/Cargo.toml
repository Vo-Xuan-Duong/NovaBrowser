[package]
name = "nova-desktop"
description = "Experimental native browser shell powered by the Obscura engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# Native Servo is opt-in until a Windows build and compositor test pass.
# The existing browser and UI remain the default build.
[features]
default = []
servo-embed = [
  "dep:servo", "dep:servo-embedder-traits", "dep:winit",
  "dep:webrender_api", "dep:euclid",
]

[dependencies]
obscura-browser = { workspace = true, features = ["render"] }
obscura-render = { workspace = true, features = ["paint"] }
tokio = { workspace = true }
serde_json = { workspace = true }
url = { workspace = true }
serde = { workspace = true }
base64 = { workspace = true }
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }

[target.'cfg(windows)'.dependencies]
servo = { version = "=0.8.0", optional = true }
servo-embedder-traits = { version = "=0.8.0", optional = true }
winit = { version = "=0.30.13", optional = true, features = ["rwh_06"] }
webrender_api = { version = "=0.70.0", optional = true }
euclid = { version = "0.22", optional = true }
